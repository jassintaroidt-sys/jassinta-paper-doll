<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="lbl-shadow-S_label-3B-1_clinic" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="rgba(27,16,23,0.18)"/>
    </filter>
  </defs>
  <g transform="rotate(3 160 160)">
    <line x1="25" y1="60" x2="10" y2="55" stroke="#E5BCCF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="120" x2="8" y2="120" stroke="#E5BCCF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="180" x2="12" y2="188" stroke="#E5BCCF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="80" y1="25" x2="75" y2="10" stroke="#E5BCCF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="160" y1="25" x2="160" y2="8" stroke="#E5BCCF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="240" y1="25" x2="248" y2="12" stroke="#E5BCCF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="295" y1="80" x2="312" y2="75" stroke="#E5BCCF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="295" y1="150" x2="310" y2="155" stroke="#E5BCCF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lembar bayangan bawah offset 3px 12% lebih gelap -->
    <rect x="43" y="44" width="240" height="240" rx="6" fill="#E5BCCF"/>
    <!-- Lembar atas warna babak bertepi deckle membulat -->
    <rect x="40" y="40" width="240" height="240" rx="6" fill="#FFD6E8" filter="url(#lbl-shadow-S_label-3B-1_clinic)"/>
    <!-- Sudut kanan bawah terangkat (segitiga 12% sisi) -->
    <polygon points="252,280 280,252 280,280" fill="#E5BCCF"/>
    <polygon points="252,280 280,252 252,252" fill="#FFFDF9" opacity="0.6"/>
    <!-- Teks baris 1: DM Mono 11px uppercase -->
    <text x="160" y="120" font-family="'DM Mono', monospace" font-size="12" font-weight="600" fill="#1B1017" opacity="0.75" text-anchor="middle" letter-spacing="1.5">3B · THE GLOW CLINIC</text>
    <!-- Teks baris 2: Shantell Sans 600 -->
    <text x="160" y="175" font-family="'Shantell Sans', cursive, sans-serif" font-size="22" font-weight="bold" fill="#1B1017" text-anchor="middle">Elsthetic &amp; Aishi Beauty</text>
